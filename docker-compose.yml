services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infralens
      POSTGRES_PASSWORD: infralens
      POSTGRES_DB: infralens
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

volumes:
  pgdata:
